name: Publish Atlas
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # Ignore releases unrelated to the static media series.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'media-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find latest published media release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .downloads
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output .downloads/releases.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=100"
          MEDIA_TAG="$(jq -r '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^media-v[0-9]+([.][0-9]+)*$")))] | sort_by(.published_at) | last | .tag_name // empty' .downloads/releases.json)"
          if [ -n "$MEDIA_TAG" ]; then
            MEDIA_URL="$(jq -r --arg tag "$MEDIA_TAG" '.[] | select(.tag_name == $tag) | [.assets[] | select(.name == "atlas-media.zip")] | first | .browser_download_url // empty' .downloads/releases.json)"
            if [ -z "$MEDIA_URL" ]; then
              echo "$MEDIA_TAG does not contain atlas-media.zip" >&2
              exit 1
            fi
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors \
              --output .downloads/atlas-media.zip \
              "$MEDIA_URL"
            test -s .downloads/atlas-media.zip
            echo "ATLAS_MEDIA_RELEASE=$MEDIA_TAG" >> "$GITHUB_ENV"
            echo "Using $MEDIA_TAG / atlas-media.zip"
          else
            echo "ATLAS_MEDIA_RELEASE=preview" >> "$GITHUB_ENV"
            echo "No published media-v* release; publishing a text-only preview"
          fi
      - name: Build and validate static site
        run: |
          if [ -f .downloads/atlas-media.zip ]; then
            python3 tools/build_site.py --media .downloads/atlas-media.zip --out _site --require-complete --release-tag "$ATLAS_MEDIA_RELEASE"
          else
            python3 tools/build_site.py --out _site --release-tag "$ATLAS_MEDIA_RELEASE"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
