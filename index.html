<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17231d">
  <meta name="description" content="Atlas — расширяемый аудиогид по странам, городам и достопримечательностям с пакетным офлайн-режимом">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Atlas">
  <title>Atlas · аудиогид</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#app-main">К содержанию</a>
  <header class="app-header">
    <button class="icon-button header-back" id="back-button" type="button" aria-label="Назад" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <a class="brand" href="#/" aria-label="Atlas — на главную">
      <span class="brand-mark">✦</span>
      <span><strong>ATLAS</strong><small>аудиогид</small></span>
    </a>
    <div class="header-actions">
      <span class="network-state" id="network-state" title="Состояние сети"></span>
      <button class="icon-button" id="downloads-button" type="button" aria-label="Загрузки и настройки">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 20h14"/></svg>
      </button>
    </div>
  </header>

  <main id="app-main" tabindex="-1">
    <section class="loading-screen" id="loading-screen" aria-live="polite">
      <span class="loading-orbit"></span>
      <p>Открываем Atlas…</p>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Основная навигация">
    <a href="#/" data-nav="explore">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 4v10l-7 4-7-4V7l7-4zm0 0v18M5 7l7 4 7-4"/></svg>
      <span>Маршруты</span>
    </a>
    <button type="button" data-nav="downloads" id="downloads-nav">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>
      <span>Офлайн</span>
    </button>
  </nav>

  <section class="audio-dock" id="audio-dock" hidden aria-label="Аудиоплеер">
    <div class="dock-main">
      <div class="dock-controls" aria-label="Управление воспроизведением">
        <button class="dock-skip" id="dock-rewind" type="button" aria-label="Назад на 5 секунд">−5</button>
        <button class="dock-play" id="dock-play" type="button" aria-label="Воспроизвести или поставить на паузу">▶</button>
        <button class="dock-skip" id="dock-forward" type="button" aria-label="Вперёд на 5 секунд">+5</button>
        <button class="dock-speed" id="dock-speed" type="button" aria-label="Изменить скорость воспроизведения">1×</button>
      </div>
      <div class="dock-copy">
        <strong id="dock-title">Рассказ</strong>
        <div class="dock-progress"><span id="dock-progress"></span></div>
        <small><span id="dock-current">0:00</span> · <span id="dock-duration">0:00</span></small>
      </div>
      <button class="dock-close" id="dock-close" type="button" aria-label="Закрыть плеер">×</button>
    </div>
    <button class="dock-next" id="dock-next" type="button" hidden>▶ Хочу узнать больше</button>
    <audio id="audio-element" preload="metadata"></audio>
  </section>

  <dialog class="point-dialog" id="point-dialog" aria-labelledby="point-dialog-title">
    <button class="point-dialog-close" id="point-dialog-close" type="button" aria-label="Закрыть точку">×</button>
    <div id="point-dialog-content"></div>
  </dialog>

  <dialog class="manager-dialog" id="downloads-dialog" aria-labelledby="downloads-title">
    <div class="dialog-head">
      <div>
        <span class="eyebrow">Настройки</span>
        <h2 id="downloads-title">Офлайн-пакеты</h2>
      </div>
      <button class="icon-button" id="downloads-close" type="button" aria-label="Закрыть">×</button>
    </div>
    <p class="dialog-intro">Скачивайте только нужные города.</p>
    <div class="storage-card" id="storage-card">Считаем занятое место…</div>
    <p class="build-version" id="build-version">Определяем версию публикации…</p>
    <div class="download-progress" id="download-progress" hidden>
      <div><strong id="download-progress-title">Загрузка</strong><span id="download-progress-value">0%</span></div>
      <progress id="download-progress-bar" max="100" value="0"></progress>
      <small id="download-progress-note"></small>
    </div>
    <div id="package-manager-list"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="./map-logic.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
